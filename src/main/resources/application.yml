server:
  port: 8080

spring:
  application:
    name: techstore

  datasource:
    url: jdbc:postgresql://localhost:5432/techstore_db
    username: deekum
    password:

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE